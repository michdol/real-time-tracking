[project]
name = "edge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "creator", email = "example@dot.com" }
]
requires-python = ">=3.13"
dependencies = [
    "confluent-kafka>=2.16.2",
    "dcsa-codes",
    "event-schemas",
    "fastapi[standard]>=0.165.0",
    "pydantic-settings>=2.16.3",
]

[tool.uv.sources]
dcsa-codes = { path = "../dcsa_codes", editable = true }
event-schemas = { path = "../event_schemas", editable = true }

[project.scripts]
edge = "edge:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.2",
    "pytest-asyncio>=1.15",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
