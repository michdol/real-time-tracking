services:

  edge:
    build:
      context: ./edge/
      dockerfile: ./Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - redpanda-quickstart-multi-broker_redpanda_network
    volumes:
      - ./edge:/edge

networks:
  redpanda-quickstart-multi-broker_redpanda_network:
    external: true
