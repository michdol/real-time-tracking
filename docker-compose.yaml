services:

  keda-consumer:
    image: keda-consumer:local
    build:
      context: .
      dockerfile: normalizer/keda-consumer/Dockerfile
    command: ["true"]
    restart: "no"

  edge:
    build:
      context: ./edge/
      dockerfile: ./Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - redpanda-quickstart-multi-broker_redpanda_network
    volumes:
      - ./edge/src:/edge/src

  keda-bootstrap:
    build:
      context: ./normalizer/keda-consumer/bootstrap
    entrypoint: ["bash", "/start.sh"]
    depends_on:
      keda-consumer:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/work:ro
      - ./normalizer/keda-consumer/bootstrap/start.sh:/start.sh:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      K3D_CLUSTER: rtt
      KEDA_VERSION: "2.16.1"
    restart: unless-stopped

networks:
  redpanda-quickstart-multi-broker_redpanda_network:
    external: true
