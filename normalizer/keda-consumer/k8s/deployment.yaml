apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-consumer
  template:
    metadata:
      labels:
        app: kafka-consumer
    spec:
      containers:
        - name: consumer
          image: keda-consumer:local
          imagePullPolicy: Never
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: kafka-consumer
                  key: bootstrap
            - name: KAFKA_TOPIC
              valueFrom:
                secretKeyRef:
                  name: kafka-consumer
                  key: topic
            - name: KAFKA_GROUP
              valueFrom:
                secretKeyRef:
                  name: kafka-consumer
                  key: group
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kafka-consumer
                  key: username
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-consumer
                  key: password
