apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: kafka-consumer
spec:
  secretTargetRef:
    - parameter: username
      name: kafka-consumer
      key: username
    - parameter: password
      name: kafka-consumer
      key: password
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: kafka-consumer
spec:
  scaleTargetRef:
    name: kafka-consumer
  minReplicaCount: 1
  maxReplicaCount: 4
  pollingInterval: 15
  cooldownPeriod: 30
  triggers:
    - type: kafka
      authenticationRef:
        name: kafka-consumer
      metadata:
        bootstrapServers: redpanda-0:9092
        consumerGroup: normalizer-consumer
        topic: raw-events
        lagThreshold: "5"
        sasl: scram_sha256
        tls: disable
